ortant}.small{font-size:12px;color:#9fb0aa}</style></head><body><section id="welcome" class="screen welcome on"><div class="panel"><div class="logo">♥</div><h1>Черви</h1><p>Карточная игра для iPhone</p><button id="start" class="btn primary">Начать игру</button><button id="openSettings" class="btn">Настройки</button></div></section><section id="settings" class="screen settings"><button id="back" class="btn" style="width:58px">‹</button><h2>Настройки</h2><div class="panel" style="text-align:left;margin:auto"><h3>Сложность ИИ</h3><div class="seg"><button data-d="easy">Легко</button><button data-d="normal" class="sel">Нормально</button><button data-d="hard">Сложно</button></div><p class="small">Сложность влияет на выбор безопасных карт и сброс штрафных карт.</p></div></section><section id="game" class="screen game"><div class="hud"><button id="menu" style="width:38px;height:38px;border-radius:12px;background:#ffffff12">☰</button><div>Раунд <b id="round">1</b></div><div id="turn" class="turn">Раздача…</div><div class="score">Ваш счёт<br><b id="myscore">0</b></div></div><div class="opp top" data-o="2"><div class="av">ИИ</div><div>Север</div><small>13 карт</small></div><div class="opp left" data-o="1"><div class="av">ИИ</div><div>Запад</div><small>13 карт</small></div><div class="opp right" data-o="3"><div class="av">ИИ</div><div>Восток</div><small>13 карт</small></div><div class="trick"><div class="slot" data-p="0"></div><div class="slot" data-p="1"></div><div class="slot" data-p="2"></div><div class="slot" data-p="3"></div><div id="msg" class="msg">Раздаём карты…</div></div><div id="hand" class="hand"></div><div id="deal" class="dealLayer hidden"><div class="deck"></div></div><div id="sheet" class="sheet hidden"><h3>Пауза</h3><button id="resume" class="btn primary">Продолжить</button><button id="restart" class="btn">Новая партия</button><button id="home" class="btn">В меню</button></div></section><script>(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const names=['Вы','Запад','Север','Восток'],suits=[['clubs','♣'],['diamonds','♦'],['spades','♠'],['hearts','♥']];let difficulty='normal',scores=[0,0,0,0],round=1,S={},drag=null;const sleep=m=>new Promise(r=>setTimeout(r,m));function show(id){$$('.screen').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on')}function makeDeck(){let a=[];for(const [s,u] of suits)for(let v=2;v<=14;v++)a.push({id:s+v,suit:s,sym:u,value:v,rank:v<11?''+v:({11:'J',12:'Q',13:'K',14:'A'}[v])});for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function pts(c){return c.suit==='hearts'?1:(c.suit==='spades'&&c.value===12?13:0)}function reset(){let d=makeDeck(),h=[[],[],[],[]];d.forEach((c,i)=>h[i%4].push(c));h.forEach(x=>x.sort((a,b)=>suits.findIndex(z=>z[0]===a.suit)-suits.findIndex(z=>z[0]===b.suit)||a.value-b.value));let starter=h.findIndex(x=>x.some(c=>c.suit==='clubs'&&c.value===2));S={h,trick:[],capt:[[],[],[],[]],rscore:[0,0,0,0],player:starter,leader:starter,tno:0,broken:false,busy:true,over:false}}function face(c,cls=''){return `<div class="card ${cls} ${(c.suit==='hearts'||c.suit==='diamonds')?'red':''}"><b>${c.rank}</b><i>${c.sym}</i><div class="pip">${c.sym}</div></div>`}function legal(p){let h=S.h[p];if(!S.trick.length){let two=h.find(c=>c.suit==='clubs'&&c.value===2);if(S.tno===0&&two)return[two];if(!S.broken){let n=h.filter(c=>c.suit!=='hearts');if(n.length)return n}return h}let lead=S.trick[0].card.suit,same=h.filter(c=>c.suit===lead);if(same.length)return same;if(S.tno===0){let clean=h.filter(c=>!pts(c));if(clean.length)return clean}return h}function renderOpp(){[1,2,3].forEach(i=>{let e=$(`[data-o="${i}"]`);e.classList.toggle('active',S.player===i);e.querySelector('small').textContent=S.h[i].length+' карт'})}function handLayout(){let h=S.h[0],W=innerWidth,step=Math.min(30,(W-80)/Math.max(1,h.length-1)),total=62+step*(h.length-1),start=(W-total)/2;return{step,start}}function renderHand(){if(drag)return;let h=S.h[0],el=$('#hand'),ok=new Set(legal(0).map(c=>c.id)),L=handLayout();el.innerHTML='';h.forEach((c,i)=>{let w=document.createElement('div');w.innerHTML=face(c,'player-card');let e=w.firstElementChild,rot=(i-(h.length-1)/2)*1.35;e.dataset.cardId=c.id;e.style.left=L.start+i*L.step+'px';e.style.bottom=Math.abs(i-(h.length-1)/2)*-.55+'px';e.style.zIndex=i+1;e.style.transform=`rotate(${rot}deg)`;e.dataset.rot=rot;if(S.player===0&&!ok.has(c.id))e.classList.add('off');el.appendChild(e)})}function update(){renderOpp();renderHand();$('#turn').textContent=S.player===0?'Ваш ход':'Ход: '+names[S.player];$('#msg').textContent=S.player===0?(S.trick.length?'Ваш ход':'Вы начинаете'):'Думает '+names[S.player]+'…'}function slotRect(p){return $(`.slot[data-p="${p}"]`).getBoundingClientRect()}function avatarRect(p){return $(`[data-o="${p}"] .av`).getBoundingClientRect()}async function animateElement(el,from,to,rot0=0,rot1=0,dur=360){el.classList.add('moving');el.style.left=from.left+'px';el.style.top=from.top+'px';el.style.bottom='auto';el.style.width='62px';el.style.height='90px';el.style.transform=`rotate(${rot0}deg) scale(1)`;document.body.appendChild(el);let dx=to.left-from.left,dy=to.top-from.top,arc=Math.min(34,Math.max(12,Math.abs(dx)*.08+Math.abs(dy)*.03));let anim=el.animate([{transform:`translate3d(0,0,0) rotate(${rot0}deg) scale(1)`},{offset:.55,transform:`translate3d(${dx*.56}px,${dy*.48-arc}px,0) rotate(${(rot0+rot1)/2+3}deg) scale(1.035)`},{transform:`translate3d(${dx}px,${dy}px,0) rotate(${rot1}deg) scale(1)`}],{duration:dur,easing:'cubic-bezier(.22,.78,.22,1)',fill:'forwards'});try{await anim.finished}catch{};anim.cancel();el.style.left=to.left+'px';el.style.top=to.top+'px';el.style.transform=`rotate(${rot1}deg)`}async function animatePlayerThrow(card,el){let from=el.getBoundingClientRect(),to=slotRect(0);el.style.visibility='visible';await animateElement(el,from,to,Number(el.dataset.rot||0),-2,330);return el}async function animateAIThrow(p,c){let r=avatarRect(p),from={left:r.left+r.width/2-31,top:r.top+r.height/2-45},to=slotRect(p),w=document.createElement('div');w.innerHTML=face(c);let el=w.firstElementChild;document.body.appendChild(el);await animateElement(el,from,to,p===1?-82:p===3?82:180,(p-2)*2,370);return el}function settleOnTable(p,c,el){let slot=$(`.slot[data-p="${p}"]`),r=(p-1.5)*3;el.classList.remove('moving','player-card','ready','off');el.classList.add('tablecard');el.style.left='0';el.style.top='0';el.style.width='62px';el.style.height='90px';el.style.setProperty('--r',r+'deg');el.style.transform=`rotate(${r}deg)`;slot.innerHTML='';slot.appendChild(el)}async function play(p,id,playerEl=null){if(S.busy)return;let c=S.h[p].find(x=>x.id===id);if(!c||!legal(p).some(x=>x.id===id))return;S.busy=true;let el=p===0&&playerEl?await animatePlayerThrow(c,playerEl):await animateAIThrow(p,c);S.h[p]=S.h[p].filter(x=>x.id!==id);if(c.suit==='hearts')S.broken=true;S.trick.push({player:p,card:c});settleOnTable(p,c,el);drag=null;renderHand();renderOpp();await sleep(120);if(S.trick.length===4)return finishTrick();S.player=(p+1)%4;S.busy=false;update();if(S.player!==0)setTimeout(ai,420)}async function collectTrick(w){let cards=$$('.slot .tablecard');if(!cards.length)return;let target=w===0?{left:innerWidth/2-31,top:innerHeight-30}:(()=>{let r=avatarRect(w);return{left:r.left+r.width/2-31,top:r.top+r.height/2-45}})();await Promise.all(cards.map((el,i)=>{let r=el.getBoundingClientRect();let a=el.animate([{transform:getComputedStyle(el).transform,opacity:1},{offset:.35,transform:`translate3d(${(i-1.5)*8}px,-12px,0) scale(.96)`,opacity:1},{transform:`translate3d(${target.left-r.left}px,${target.top-r.top}px,0) scale(.55)`,opacity:.15}],{duration:420+i*18,easing:'cubic-bezier(.2,.75,.25,1)',fill:'forwards'});return a.finished.catch(()=>{})}));$$('.slot').forEach(s=>s.innerHTML='')}async function finishTrick(){let lead=S.trick[0].card.suit,w=S.trick.filter(x=>x.card.suit===lead).reduce((a,b)=>a.card.value>b.card.value?a:b).player,p=S.trick.reduce((a,x)=>a+pts(x.card),0);S.capt[w].push(...S.trick.map(x=>x.card));S.rscore[w]+=p;$('#msg').textContent=names[w]+' берёт взятку'+(p?' · +'+p:'');await sleep(420);await collectTrick(w);S.trick=[];S.tno++;S.player=S.leader=w;if(S.h.every(x=>x.length===0))return finishRound();S.busy=false;update();if(w!==0)setTimeout(ai,430)}function pick(p){let L=legal(p);if(difficulty==='easy')return L[Math.floor(Math.random()*L.length)];if(S.trick.length){let lead=S.trick[0].card.suit,top=S.trick.filter(x=>x.card.suit===lead).sort((a,b)=>b.card.value-a.card.value)[0];if(L[0].suit===lead){let lose=L.filter(c=>c.value<top.card.value).sort((a,b)=>b.value-a.value);if(lose.length)return lose[0];return [...L].sort((a,b)=>a.value-b.value)[0]}}let q=L.find(c=>c.suit==='spades'&&c.value===12);if(q)return q;let h=L.filter(c=>c.suit==='hearts').sort((a,b)=>b.value-a.value);if(h.length)return h[0];return [...L].sort((a,b)=>difficulty==='hard'?b.value-a.value:a.value-b.value)[0]}function ai(){if(S.busy||S.player===0||S.over)return;play(S.player,pick(S.player).id)}async function finishRound(){S.over=true;let moon=S.rscore.findIndex(x=>x===26);if(moon>=0)S.rscore=S.rscore.map((_,i)=>i===moon?0:26);scores=scores.map((x,i)=>x+S.rscore[i]);$('#myscore').textContent=scores[0];$('#msg').textContent='Раунд завершён';await sleep(900);round++;$('#round').textContent=round;reset();await deal();S.busy=false;update();if(S.player!==0)setTimeout(ai,450)}function dealTarget(p,i){if(p===0){let L=handLayout();return{left:L.start+Math.min(i,12)*L.step,top:innerHeight-100}}let r=avatarRect(p);return{left:r.left+r.width/2-31+(i%3-1)*3,top:r.top+r.height/2-45+(i%4-2)*2}}async function deal(){let layer=$('#deal');layer.classList.remove('hidden');$('#turn').textContent='Раздача…';$('#msg').textContent='Раздаём карты…';await sleep(180);let d=$('.deck').getBoundingClientRect(),origin={left:d.left+7,top:d.top+9};for(let i=0;i<52;i++){let p=i%4,t=dealTarget(p,Math.floor(i/4)),b=document.createElement('div');b.className='back';b.style.left=origin.left+'px';b.style.top=origin.top+'px';document.body.appendChild(b);let dx=t.left-origin.left,dy=t.top-origin.top,r=(p-1.5)*5+(i%3-1)*1.5,a=b.animate([{transform:'translate3d(0,0,0) rotate(0deg)'},{offset:.55,transform:`translate3d(${dx*.58}px,${dy*.48-24}px,0) rotate(${r+4}deg)`},{transform:`translate3d(${dx}px,${dy}px,0) rotate(${r}deg)`}],{duration:310,easing:'cubic-bezier(.18,.78,.2,1)',fill:'forwards'});a.finished.then(()=>b.remove()).catch(()=>b.remove());await sleep(30)}await sleep(360);layer.classList.add('hidden');renderHand();renderOpp()}function startDrag(e,cardEl,t){if(S.busy||S.player!==0)return;let id=cardEl.dataset.cardId;if(!legal(0).some(c=>c.id===id))return;let r=cardEl.getBoundingClientRect();drag={id,el:cardEl,startX:t.clientX,startY:t.clientY,lastX:t.clientX,lastY:t.clientY,from:r,rot:Number(cardEl.dataset.rot||0)};cardEl.classList.add('ready');cardEl.style.zIndex=200;cardEl.style.transform=`translate3d(0,-8px,0) rotate(${drag.rot}deg) scale(1.035)`}function moveDrag(t){if(!drag)return;drag.lastX=t.clientX;drag.lastY=t.clientY;let dx=Math.max(-34,Math.min(34,t.clientX-drag.startX)),dy=Math.max(-190,Math.min(0,t.clientY-drag.startY));drag.el.style.transition='none';drag.el.style.transform=`translate3d(${dx}px,${dy-8}px,0) rotate(${drag.rot+dx*.035}deg) scale(1.04)`}async function endDrag(){if(!drag)return;let D=drag,dy=D.lastY-D.startY;D.el.classList.remove('ready');D.el.style.transition='';if(dy<-46){await play(0,D.id,D.el)}else{D.el.animate([{transform:getComputedStyle(D.el).transform},{transform:`rotate(${D.rot}deg)`}],{duration:180,easing:'cubic-bezier(.22,.8,.2,1)'});drag=null;setTimeout(renderHand,180)}}$('#hand').addEventListener('touchstart',e=>{let el=e.target.closest('.player-card');if(!el)return;e.preventDefault();e.stopPropagation();startDrag(e,el,e.touches[0])},{passive:false});$('#hand').addEventListener('touchmove',e=>{if(!drag)return;e.preventDefault();e.stopPropagation();moveDrag(e.touches[0])},{passive:false});$('#hand').addEventListener('touchend',e=>{if(!drag)return;e.preventDefault();e.stopPropagation();endDrag()},{passive:false});$('#hand').addEventListener('touchcancel',e=>{if(!drag)return;e.preventDefault();drag=null;renderHand()},{passive:false});document.addEventListener('touchmove',e=>{if($('#game').classList.contains('on'))e.preventDefault()},{passive:false});document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});['gesturestart','gesturechange','gestureend'].forEach(x=>document.addEventListener(x,e=>e.preventDefault(),{passive:false}));let lastTouch=0;document.addEventListener('touchend',e=>{let n=Date.now();if(n-lastTouch<300)e.preventDefault();lastTouch=n},{passive:false});async function start(){scores=[0,0,0,0];round=1;$('#round').textContent=1;$('#myscore').textContent=0;show('game');reset();await deal();S.busy=false;update();if(S.player!==0)setTimeout(ai,450)}$('#start').onclick=start;$('#openSettings').onclick=()=>show('settings');$('#back').onclick=()=>show('welcome');$$('[data-d]').forEach(b=>b.onclick=()=>{$$('[data-d]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');difficulty=b.dataset.d});$('#menu').onclick=()=>{$('#sheet').classList.remove('hidden');S.busy=true};$('#resume').onclick=()=>{$('#sheet').classList.add('hidden');S.busy=false;update();if(S.player!==0)setTimeout(ai,300)};$('#restart').onclick=async()=>{$('#sheet').classList.add('hidden');scores=[0,0,0,0];round=1;$('#round').textContent=1;$('#myscore').textContent=0;reset();await deal();S.busy=false;update();if(S.player!==0)setTimeout(ai,450)};$('#home').onclick=()=>{S.over=true;drag=null;show('welcome')};addEventListener('resize',()=>{if(S.h&&!drag)renderHand()})})();</script></body></html>
