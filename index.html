<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#081b16"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Черви</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08110e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}button{font:inherit;color:inherit;border:0;touch-action:manipulation}.screen{position:fixed;inset:0;display:none}.on{display:block}.welcome{background:radial-gradient(circle at 50% 20%,#2a3049,#101522 45%,#070b12);padding:max(28px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));display:none;align-items:center;justify-content:center}.welcome.on{display:flex}.panel{width:min(92vw,390px);padding:30px 24px;border-radius:30px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(24px);text-align:center;box-shadow:0 24px 70px #0008}.logo{width:86px;height:86px;border-radius:28px;background:linear-gradient(145deg,#ff6581,#c62a51);display:grid;place-items:center;font-size:48px;margin:-70px auto 18px;box-shadow:0 16px 44px #ff416744}.panel h1{font-size:48px;margin:0 0 8px}.panel p{color:#aab3c3;margin:0 0 24px}.btn{width:100%;min-height:56px;border-radius:17px;margin-top:10px;font-weight:800;font-size:17px;background:#ffffff14;border:1px solid #ffffff12}.btn.primary{background:linear-gradient(#ff5878,#df355b);box-shadow:0 12px 28px #df355b44}.settings{background:linear-gradient(#121827,#090d15);padding:max(16px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));overflow:auto}.settings h2{margin:14px 0 20px}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:6px;background:#ffffff0b;border-radius:16px}.seg button{padding:13px 3px;border-radius:12px;background:transparent;color:#9da8b8;font-weight:700}.seg .sel{background:#fff;color:#111}.game{background:radial-gradient(ellipse at center,#167658,#0d513e 52%,#06261d);touch-action:none}.hud{position:absolute;z-index:30;left:10px;right:10px;top:max(8px,env(safe-area-inset-top));height:52px;border-radius:17px;background:#0c1514bb;border:1px solid #ffffff15;display:flex;align-items:center;padding:0 12px;gap:12px;backdrop-filter:blur(16px)}.turn{margin:auto;font-size:12px;font-weight:800}.score{font-size:12px;text-align:right}.opp{position:absolute;z-index:5;text-align:center;font-size:11px;pointer-events:none}.opp .av{width:42px;height:42px;border-radius:50%;background:#132a32;border:1px solid #ffffff25;display:grid;place-items:center;font-weight:900;margin:auto}.opp.top{top:max(76px,calc(env(safe-area-inset-top) + 70px));left:50%;transform:translateX(-50%)}.opp.left{left:12px;top:42%;transform:translateY(-50%)}.opp.right{right:12px;top:42%;transform:translateY(-50%)}.opp.active .av{box-shadow:0 0 0 2px #ffe96d,0 0 25px #ffe96d66}.trick{position:absolute;left:50%;top:47%;width:210px;height:190px;transform:translate(-50%,-50%);pointer-events:none}.slot{position:absolute;width:58px;height:84px}.slot[data-p="2"]{left:76px;top:0}.slot[data-p="0"]{left:76px;bottom:0}.slot[data-p="1"]{left:0;top:53px}.slot[data-p="3"]{right:0;top:53px}.msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:8px 10px;border-radius:12px;background:#03130ec9;font-size:10px;font-weight:800;white-space:nowrap}.hand{position:absolute;left:0;right:0;bottom:max(6px,env(safe-area-inset-bottom));height:160px;touch-action:none}.card{position:absolute;width:60px;height:88px;border-radius:10px;background:linear-gradient(150deg,#fff,#edf0f4);color:#111;padding:6px;border:1px solid #0002;box-shadow:0 10px 20px #0007;transform-origin:50% 100%;transition:transform .18s,filter .18s,opacity .18s,left .18s;touch-action:none;will-change:transform}.card.red{color:#d9274c}.card b{font-size:17px;display:block;line-height:1}.card i{font-style:normal;font-size:18px}.card .pip{font-size:25px;text-align:center;margin-top:13px}.card.off{filter:brightness(.5) saturate(.4);opacity:.55}.card.drag{transition:none;z-index:999!important;transform:translate(var(--dx),var(--dy)) scale(1.09)!important}.tablecard{position:static;width:58px;height:84px}.deal{position:absolute;inset:0;z-index:50;background:#07100ddd;display:grid;place-items:center;pointer-events:none}.deck{width:78px;height:110px;border-radius:13px;background:linear-gradient(145deg,#b72e50,#6e172e);border:2px solid #ffffff35;display:grid;place-items:center;font-size:38px;animation:pulse .8s infinite alternate}@keyframes pulse{to{transform:scale(1.06) rotate(-3deg)}}.hidden{display:none!important}.sheet{position:absolute;z-index:80;inset:auto 14px max(14px,env(safe-area-inset-bottom));padding:16px;border-radius:22px;background:#111a18ee;border:1px solid #ffffff18;backdrop-filter:blur(18px)}.sheet h3{margin:4px 0 12px}.small{font-size:12px;color:#9fb0aa}</style></head><body><section id="welcome" class="screen welcome on"><div class="panel"><div class="logo">♥</div><h1>Черви</h1><p>Классическая карточная игра для iPhone</p><button id="start" class="btn primary">Начать игру</button><button id="openSettings" class="btn">Настройки</button></div></section><section id="settings" class="screen settings"><button id="back" class="btn" style="width:58px">‹</button><h2>Настройки</h2><div class="panel" style="text-align:left;margin:auto"><h3>Сложность ИИ</h3><div class="seg"><button data-d="easy">Легко</button><button data-d="normal" class="sel">Нормально</button><button data-d="hard">Сложно</button></div><p class="small">Сложность влияет на выбор безопасных карт и попытки сбросить штрафные карты.</p></div></section><section id="game" class="screen game"><div class="hud"><button id="menu" style="width:38px;height:38px;border-radius:12px;background:#ffffff12">☰</button><div>Раунд <b id="round">1</b></div><div id="turn" class="turn">Раздача…</div><div class="score">Ваш счёт<br><b id="myscore">0</b></div></div><div class="opp top" data-o="2"><div class="av">ИИ</div><div>Север</div><small>13 карт</small></div><div class="opp left" data-o="1"><div class="av">ИИ</div><div>Запад</div><small>13 карт</small></div><div class="opp right" data-o="3"><div class="av">ИИ</div><div>Восток</div><small>13 карт</small></div><div class="trick"><div class="slot" data-p="0"></div><div class="slot" data-p="1"></div><div class="slot" data-p="2"></div><div class="slot" data-p="3"></div><div id="msg" class="msg">Раздаём карты…</div></div><div id="hand" class="hand"></div><div id="deal" class="deal"><div class="deck">♥</div></div><div id="sheet" class="sheet hidden"><h3>Пауза</h3><button id="resume" class="btn primary">Продолжить</button><button id="restart" class="btn">Новая партия</button><button id="home" class="btn">В меню</button></div></section><script>(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const names=['Вы','Запад','Север','Восток'],suits=[['clubs','♣'],['diamonds','♦'],['spades','♠'],['hearts','♥']];let difficulty='normal',scores=[0,0,0,0],round=1,S={};const sleep=m=>new Promise(r=>setTimeout(r,m));function show(id){$$('.screen').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on')}function deck(){let a=[];for(const [s,u] of suits)for(let v=2;v<=14;v++)a.push({id:s+v,suit:s,sym:u,value:v,rank:v<11?''+v:({11:'J',12:'Q',13:'K',14:'A'}[v])});for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function points(c){return c.suit==='hearts'?1:(c.suit==='spades'&&c.value===12?13:0)}function reset(){let d=deck(),h=[[],[],[],[]];d.forEach((c,i)=>h[i%4].push(c));h.forEach(x=>x.sort((a,b)=>suits.findIndex(z=>z[0]===a.suit)-suits.findIndex(z=>z[0]===b.suit)||a.value-b.value));let starter=h.findIndex(x=>x.some(c=>c.suit==='clubs'&&c.value===2));S={h,trick:[],capt:[[],[],[],[]],rscore:[0,0,0,0],player:starter,leader:starter,tno:0,broken:false,busy:true,over:false}}function markup(c,table=false){return `<div class="card ${c.suit==='hearts'||c.suit==='diamonds'?'red':''} ${table?'tablecard':''}"><b>${c.rank}</b><i>${c.sym}</i><div class="pip">${c.sym}</div></div>`}function legal(p){let h=S.h[p];if(!S.trick.length){let two=h.find(c=>c.suit==='clubs'&&c.value===2);if(S.tno===0&&two)return[two];if(!S.broken){let n=h.filter(c=>c.suit!=='hearts');if(n.length)return n}return h}let lead=S.trick[0].card.suit,same=h.filter(c=>c.suit===lead);if(same.length)return same;if(S.tno===0){let clean=h.filter(c=>!points(c));if(clean.length)return clean}return h}function renderOpp(){[1,2,3].forEach(i=>{let e=$(`[data-o="${i}"]`);e.classList.toggle('active',S.player===i);e.querySelector('small').textContent=S.h[i].length+' карт'})}function renderHand(){let h=S.h[0],el=$('#hand');el.innerHTML='';let ok=new Set(legal(0).map(c=>c.id)),W=innerWidth,step=Math.min(30,(W-78)/Math.max(1,h.length-1)),total=60+step*(h.length-1),start=(W-total)/2;h.forEach((c,i)=>{let w=document.createElement('div');w.innerHTML=markup(c);let e=w.firstElementChild;e.style.left=start+i*step+'px';e.style.bottom=Math.abs(i-(h.length-1)/2)*-0.5+'px';e.style.zIndex=i+1;e.style.transform=`rotate(${(i-(h.length-1)/2)*1.4}deg)`;if(S.player===0&&!ok.has(c.id))e.classList.add('off');gesture(e,c);el.appendChild(e)})}function gesture(e,c){let active=false,sx=0,sy=0,lx=0,ly=0;e.addEventListener('pointerdown',x=>{if(S.busy||S.player!==0||!legal(0).some(k=>k.id===c.id))return;active=true;sx=lx=x.clientX;sy=ly=x.clientY;e.setPointerCapture?.(x.pointerId);e.classList.add('drag');x.preventDefault()},{passive:false});e.addEventListener('pointermove',x=>{if(!active)return;lx=x.clientX;ly=x.clientY;e.style.setProperty('--dx',lx-sx+'px');e.style.setProperty('--dy',ly-sy+'px');x.preventDefault()},{passive:false});e.addEventListener('pointerup',x=>{if(!active)return;active=false;e.classList.remove('drag');if(ly-sy<-45)play(0,c.id);else renderHand();x.preventDefault()},{passive:false})}function place(p,c){$(`.slot[data-p="${p}"]`).innerHTML=markup(c,true)}function clear(){$$('.slot').forEach(e=>e.innerHTML='')}function update(){renderOpp();renderHand();$('#turn').textContent=S.player===0?'Ваш ход':'Ход: '+names[S.player];$('#msg').textContent=S.player===0?(S.trick.length?'Ваш ход':'Вы начинаете'):'Думает '+names[S.player]+'…'}async function play(p,id){if(S.busy)return;let c=S.h[p].find(x=>x.id===id);if(!c||!legal(p).some(x=>x.id===id))return;S.busy=true;S.h[p]=S.h[p].filter(x=>x.id!==id);if(c.suit==='hearts')S.broken=true;S.trick.push({player:p,card:c});place(p,c);renderHand();renderOpp();await sleep(300);if(S.trick.length===4)return finishTrick();S.player=(p+1)%4;S.busy=false;update();if(S.player!==0)setTimeout(ai,500)}async function finishTrick(){let lead=S.trick[0].card.suit,w=S.trick.filter(x=>x.card.suit===lead).reduce((a,b)=>a.card.value>b.card.value?a:b).player,pts=S.trick.reduce((a,x)=>a+points(x.card),0);S.capt[w].push(...S.trick.map(x=>x.card));S.rscore[w]+=pts;$('#msg').textContent=names[w]+' берёт взятку'+(pts?' · +'+pts:'');await sleep(800);clear();S.trick=[];S.tno++;S.player=S.leader=w;if(S.h.every(x=>x.length===0))return finishRound();S.busy=false;update();if(w!==0)setTimeout(ai,500)}function pick(p){let L=legal(p);if(difficulty==='easy')return L[Math.floor(Math.random()*L.length)];if(S.trick.length){let lead=S.trick[0].card.suit,top=S.trick.filter(x=>x.card.suit===lead).sort((a,b)=>b.card.value-a.card.value)[0];if(L[0].suit===lead){let lose=L.filter(c=>c.value<top.card.value).sort((a,b)=>b.value-a.value);if(lose.length)return lose[0];return [...L].sort((a,b)=>a.value-b.value)[0]}}let q=L.find(c=>c.suit==='spades'&&c.value===12);if(q)return q;let h=L.filter(c=>c.suit==='hearts').sort((a,b)=>b.value-a.value);if(h.length)return h[0];return [...L].sort((a,b)=>difficulty==='hard'?b.value-a.value:a.value-b.value)[0]}function ai(){if(S.busy||S.player===0||S.over)return;play(S.player,pick(S.player).id)}async function finishRound(){S.over=true;let moon=S.rscore.findIndex(x=>x===26);if(moon>=0)S.rscore=S.rscore.map((_,i)=>i===moon?0:26);scores=scores.map((x,i)=>x+S.rscore[i]);$('#myscore').textContent=scores[0];let txt='Раунд: '+S.rscore.map((x,i)=>names[i]+' +'+x).join(' · ');alert(txt);round++;$('#round').textContent=round;reset();await deal();S.busy=false;update();if(S.player!==0)setTimeout(ai,500)}async function deal(){$('#deal').classList.remove('hidden');$('#turn').textContent='Раздача…';$('#msg').textContent='Раздаём карты…';await sleep(1100);$('#deal').classList.add('hidden');renderHand();renderOpp()}async function start(){scores=[0,0,0,0];round=1;$('#round').textContent=1;$('#myscore').textContent=0;show('game');reset();await deal();S.busy=false;update();if(S.player!==0)setTimeout(ai,500)}$('#start').onclick=start;$('#openSettings').onclick=()=>show('settings');$('#back').onclick=()=>show('welcome');$$('[data-d]').forEach(b=>b.onclick=()=>{$$('[data-d]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');difficulty=b.dataset.d});$('#menu').onclick=()=>{$('#sheet').classList.remove('hidden');S.busy=true};$('#resume').onclick=()=>{$('#sheet').classList.add('hidden');S.busy=false;update();if(S.player!==0)setTimeout(ai,300)};$('#restart').onclick=async()=>{$('#sheet').classList.add('hidden');scores=[0,0,0,0];round=1;$('#round').textContent=1;$('#myscore').textContent=0;reset();await deal();S.busy=false;update();if(S.player!==0)setTimeout(ai,500)};$('#home').onclick=()=>{S.over=true;show('welcome')};addEventListener('resize',()=>S.h&&renderHand());document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('touchmove',e=>{if(e.scale&&e.scale!==1)e.preventDefault()},{passive:false})})();</script></body></html>
