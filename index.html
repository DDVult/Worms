<section id="welcome" class="screen welcome on"><div class="hero"><div class="mark">♥</div><h1>Черви</h1><p>Классическая партия. Новый мобильный стол.</p><button id="start" class="btn primary">Начать игру</button><div class="versionHome">v0.7.0 · MOBILE REBUILD</div></div></section>
<section id="game" class="screen"><div class="hud"><button id="menu" class="menu">•••</button><div class="hudLabel">Раунд<b id="round">1</b></div><div class="hudLabel score">Ваш счёт<b id="myscore">0</b></div></div><div id="stackTop" class="oppStack top"></div><div id="stackLeft" class="oppStack left"></div><div id="stackRight" class="oppStack right"></div><div class="opponent oppTop"><div class="avatar">N</div><div class="oppName">Север</div><div class="oppCount" id="c2">13 карт</div></div><div class="opponent oppLeft"><div class="avatar">W</div><div class="oppName">Запад</div><div class="oppCount" id="c1">13 карт</div></div><div class="opponent oppRight"><div class="avatar">E</div><div class="oppName">Восток</div><div class="oppCount" id="c3">13 карт</div></div><div id="center" class="center"></div><div class="playerZone"><div class="youBadge"><div>Вы</div><div class="youAvatar">☺</div></div><div id="hand" class="hand"></div></div><div id="hint" class="hint">Подготовка…</div><div class="version">v0.7.0</div><div id="sheet" class="sheet hidden"><h3>Пауза</h3><button id="resume" class="btn primary">Продолжить</button><button id="restart" class="btn">Новая партия</button><button id="home" class="btn">В меню</button></div></section>
<script>(()=>{const $=s=>document.querySelector(s),suits=[['clubs','♣'],['diamonds','♦'],['spades','♠'],['hearts','♥']],names=['Вы','Запад','Север','Восток'];let round=1,scores=[0,0,0,0],S={},busy=false,drag=null;function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on')}function deck(){let a=[];for(const [s,u] of suits)for(let v=2;v<=14;v++)a.push({id:s+v,suit:s,sym:u,value:v,rank:v<11?''+v:({11:'J',12:'Q',13:'K',14:'A'}[v])});for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function pts(c){return c.suit==='hearts'?1:(c.suit==='spades'&&c.value===12?13:0)}function reset(){let d=deck(),h=[[],[],[],[]];d.forEach((c,i)=>h[i%4].push(c));h.forEach(x=>x.sort((a,b)=>suits.findIndex(z=>z[0]===a.suit)-suits.findIndex(z=>z[0]===b.suit)||a.value-b.value));let starter=h.findIndex(x=>x.some(c=>c.id==='clubs2'));S={h,trick:[],rscore:[0,0,0,0],player:starter,leader:starter,tno:0,broken:false,over:false}}function legal(p){let h=S.h[p];if(!S.trick.length){let two=h.find(c=>c.id==='clubs2');if(S.tno===0&&two)return[two];if(!S.broken){let n=h.filter(c=>c.suit!=='hearts');if(n.length)return n}return h}let lead=S.trick[0].card.suit,same=h.filter(c=>c.suit===lead);if(same.length)return same;if(S.tno===0){let clean=h.filter(c=>!pts(c));if(clean.length)return clean}return h}function stacks(){[['#stackTop',2],['#stackLeft',1],['#stackRight',3]].forEach(([sel,p])=>{let el=$(sel);el.innerHTML='';let n=Math.min(13,S.h[p].length);for(let i=0;i<n;i++){let c=document.createElement('div');c.className='backCard';if(sel==='#stackTop'){let span=Math.min(72,n*5.2);c.style.left=`calc(50% - ${span/2}px + ${i*(span/(Math.max(1,n-1)))}px)`;c.style.transform=`rotate(${(i-(n-1)/2)*.7}deg)`}else{let span=Math.min(el.clientHeight-70,n*26);c.style.top=(i*(span/Math.max(1,n-1)))+'px'}el.appendChild(c)}})}function cardEl(c,cls='card'){let e=document.createElement('div');e.className=cls+((c.suit==='hearts'||c.suit==='diamonds')?' red':'');e.dataset.id=c.id;e.innerHTML=`<div class="r">${c.rank}</div><div class="s">${c.sym}</div>`;return e}function renderHand(){let hand=$('#hand');hand.innerHTML='';let n=S.h[0].length,ok=new Set(S.player===0?legal(0).map(c=>c.id):[]),width=Math.min(innerWidth*.96,520),spread=Math.min(width-86,Math.max(140,(n-1)*31));S.h[0].forEach((c,i)=>{let e=cardEl(c),t=n===1?0:(i/(n-1)-.5),x=t*spread,rot=t*10,y=Math.abs(t)*9;e.style.zIndex=i+1;e.style.transform=`translateX(calc(-50% + ${x}px)) translateY(${y}px) rotate(${rot}deg)`;e.dataset.base=`${x},${y},${rot}`;if(!ok.has(c.id))e.classList.add('disabled');hand.appendChild(e)})}function update(){['1','2','3'].forEach(i=>$('#c'+i).textContent=S.h[+i].length+' карт');$('#round').textContent=round;$('#myscore').textContent=scores[0];renderHand();stacks();$('#hint').textContent=S.player===0?'Смахните карту вверх':'Ход: '+names[S.player]}function trickPosClass(p){return 'trickCard p'+p}function addTrick(p,c){let e=cardEl(c,trickPosClass(p));$('#center').appendChild(e)}function clearTrick(){let es=[...$('#center').children];es.forEach((e,i)=>setTimeout(()=>{e.style.opacity='0';e.style.transform+=' scale(.75)'},i*30));setTimeout(()=>$('#center').innerHTML='',260)}function commit(p,c){if(c.suit==='hearts')S.broken=true;S.trick.push({player:p,card:c});addTrick(p,c)}function pick(p){let L=legal(p);if(S.trick.length){let lead=S.trick[0].card.suit,top=Math.max(...S.trick.filter(x=>x.card.suit===lead).map(x=>x.card.value)),same=L.filter(c=>c.suit===lead);if(same.length){let lose=same.filter(c=>c.value<top).sort((a,b)=>b.value-a.value);return lose[0]||same.sort((a,b)=>a.value-b.value)[0]}}let q=L.find(c=>c.id==='spades12');if(q)return q;let h=L.filter(c=>c.suit==='hearts').sort((a,b)=>b.value-a.value);return h[0]||L[Math.floor(Math.random()*L.length)]}function next(){if(S.trick.length===4){finishTrick();return}S.player=(S.player+1)%4;update();if(S.player!==0)setTimeout(ai,480)}function ai(){if(busy||S.player===0||S.over)return;busy=true;let p=S.player,c=pick(p);S.h[p]=S.h[p].filter(x=>x.id!==c.id);commit(p,c);update();setTimeout(()=>{busy=false;next()},300)}function finishTrick(){busy=true;let lead=S.trick[0].card.suit,w=S.trick.filter(x=>x.card.suit===lead).reduce((a,b)=>a.card.value>b.card.value?a:b).player,pp=S.trick.reduce((n,x)=>n+pts(x.card),0);S.rscore[w]+=pp;$('#hint').textContent=names[w]+' берёт взятку'+(pp?' · +'+pp:'');setTimeout(()=>{clearTrick();S.trick=[];S.tno++;S.player=S.leader=w;busy=false;if(S.h.every(x=>x.length===0)){finishRound();return}update();if(S.player!==0)setTimeout(ai,500)},700)}function finishRound(){S.over=true;let moon=S.rscore.findIndex(x=>x===26);if(moon>=0)S.rscore=S.rscore.map((_,i)=>i===moon?0:26);scores=scores.map((x,i)=>x+S.rscore[i]);$('#myscore').textContent=scores[0];$('#hint').textContent='Раунд завершён';setTimeout(()=>{round++;reset();S.over=false;update();if(S.player!==0)setTimeout(ai,500)},1200)}function play(id){if(busy||S.player!==0)return;let c=S.h[0].find(x=>x.id===id);if(!c||!legal(0).some(x=>x.id===id))return;busy=true;S.h[0]=S.h[0].filter(x=>x.id!==id);commit(0,c);renderHand();setTimeout(()=>{busy=false;next()},280)}function down(e){let card=e.target.closest('.card');if(!card||card.classList.contains('disabled')||busy||S.player!==0)return;e.preventDefault();let [x,y,r]=card.dataset.base.split(',').map(Number);drag={card,id:card.dataset.id,startX:e.clientX,startY:e.clientY,x,y,r,pid:e.pointerId};card.classList.add('dragging');card.setPointerCapture?.(e.pointerId)}function move(e){if(!drag)return;e.preventDefault();let dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;drag.card.style.transform=`translateX(calc(-50% + ${drag.x+dx}px)) translateY(${drag.y+dy}px) rotate(${drag.r+dx*.03}deg) scale(1.03)`}function up(e){if(!drag)return;e.preventDefault();let d=drag;drag=null;d.card.classList.remove('dragging');if(e.clientY-d.startY<-58)play(d.id);else d.card.style.transform=`translateX(calc(-50% + ${d.x}px)) translateY(${d.y}px) rotate(${d.r}deg)`}$('#hand').addEventListener('pointerdown',down,{passive:false});$('#hand').addEventListener('pointermove',move,{passive:false});$('#hand').addEventListener('pointerup',up,{passive:false});$('#hand').addEventListener('pointercancel',up,{passive:false});$('#start').onclick=()=>{scores=[0,0,0,0];round=1;reset();show('game');update();if(S.player!==0)setTimeout(ai,500)};$('#menu').onclick=()=>{$('#sheet').classList.remove('hidden');busy=true};$('#resume').onclick=()=>{$('#sheet').classList.add('hidden');busy=false;update();if(S.player!==0)setTimeout(ai,300)};$('#restart').onclick=()=>{$('#sheet').classList.add('hidden');scores=[0,0,0,0];round=1;reset();busy=false;$('#center').innerHTML='';update();if(S.player!==0)setTimeout(ai,400)};$('#home').onclick=()=>{$('#sheet').classList.add('hidden');show('welcome');busy=false};addEventListener('resize',()=>{if($('#game').classList.contains('on'))update()});addEventListener('dblclick',e=>e.preventDefault(),{passive:false});})();</script></body></html>
