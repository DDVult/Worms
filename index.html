<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#071713"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Черви 3D</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071713;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;overscroll-behavior:none}body{position:fixed;inset:0}button{font:inherit;color:inherit;border:0;touch-action:manipulation}.screen{position:fixed;inset:0;display:none}.screen.on{display:block}.welcome{background:radial-gradient(circle at 50% 16%,#2d3954 0,#121827 48%,#070b11 100%);padding:max(28px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));align-items:center;justify-content:center}.welcome.on{display:flex}.panel{width:min(92vw,390px);padding:30px 24px;border-radius:30px;background:#ffffff0d;border:1px solid #ffffff18;backdrop-filter:blur(24px);text-align:center;box-shadow:0 28px 70px #0008}.logo{width:88px;height:88px;border-radius:28px;background:linear-gradient(145deg,#ff6986,#c82e53);display:grid;place-items:center;font-size:50px;margin:-72px auto 18px;box-shadow:0 18px 44px #ff466b44}.panel h1{font-size:48px;margin:0 0 7px}.panel p{color:#aeb8c7;margin:0 0 24px}.btn{width:100%;min-height:56px;border-radius:17px;margin-top:10px;font-weight:800;font-size:17px;background:#ffffff14;border:1px solid #ffffff12}.primary{background:linear-gradient(#ff5a79,#df345a);box-shadow:0 12px 28px #df355b44}.settings{background:linear-gradient(#111827,#090d14);padding:max(16px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));overflow:auto}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:6px;background:#ffffff0b;border-radius:16px}.seg button{padding:13px 3px;border-radius:12px;background:transparent;color:#9ca8b7;font-weight:700}.seg .sel{background:#fff;color:#111}#game{background:#061812;touch-action:none}#stage{position:absolute;inset:0;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;z-index:20;left:10px;right:10px;top:max(8px,env(safe-area-inset-top));height:54px;border-radius:18px;background:#07110fbd;border:1px solid #ffffff18;display:flex;align-items:center;padding:0 12px;gap:12px;backdrop-filter:blur(18px);pointer-events:none}.hud button{pointer-events:auto}.turn{margin:auto;font-size:12px;font-weight:800}.score{font-size:12px;text-align:right}.hint{position:absolute;z-index:20;left:50%;bottom:calc(182px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:9px 12px;border-radius:14px;background:#07110fc9;border:1px solid #ffffff14;font-size:11px;font-weight:800;white-space:nowrap;pointer-events:none}.seat{position:absolute;z-index:15;font-size:11px;text-align:center;pointer-events:none;text-shadow:0 1px 2px #000}.seat span{display:block;width:42px;height:42px;border-radius:50%;margin:auto;background:#102e28cc;border:1px solid #ffffff24;display:grid;place-items:center;font-weight:900}.seat.active span{box-shadow:0 0 0 2px #ffe873,0 0 24px #ffe87366}.north{top:max(78px,calc(env(safe-area-inset-top) + 72px));left:50%;transform:translateX(-50%)}.west{left:12px;top:41%;transform:translateY(-50%)}.east{right:12px;top:41%;transform:translateY(-50%)}.sheet{position:absolute;z-index:50;inset:auto 14px max(14px,env(safe-area-inset-bottom));padding:16px;border-radius:22px;background:#111a18ee;border:1px solid #ffffff18;backdrop-filter:blur(18px)}.hidden{display:none!important}.small{font-size:12px;color:#9fb0aa}.loading{position:absolute;inset:0;z-index:60;background:#071713;display:grid;place-items:center;font-weight:800}</style></head><body><section id="welcome" class="screen welcome on"><div class="panel"><div class="logo">♥</div><h1>Черви</h1><p>3D карточный стол для iPhone</p><button id="start" class="btn primary">Начать игру</button><button id="openSettings" class="btn">Настройки</button></div></section><section id="settings" class="screen settings"><button id="back" class="btn" style="width:58px">‹</button><h2>Настройки</h2><div class="panel" style="text-align:left;margin:auto"><h3>Сложность ИИ</h3><div class="seg"><button data-d="easy">Легко</button><button data-d="normal" class="sel">Нормально</button><button data-d="hard">Сложно</button></div><p class="small">В 3D-режиме визуальный слой отделён от правил игры: карта движется как один физический объект.</p></div></section><section id="game" class="screen"><div id="stage"></div><div class="hud"><button id="menu" style="width:38px;height:38px;border-radius:12px;background:#ffffff12">☰</button><div>Раунд <b id="round">1</b></div><div id="turn" class="turn">Раздача…</div><div class="score">Ваш счёт<br><b id="myscore">0</b></div></div><div class="seat north" data-seat="2"><span>ИИ</span><b>Север</b><small>13</small></div><div class="seat west" data-seat="1"><span>ИИ</span><b>Запад</b><small>13</small></div><div class="seat east" data-seat="3"><span>ИИ</span><b>Восток</b><small>13</small></div><div id="hint" class="hint">Раздаём карты…</div><div id="sheet" class="sheet hidden"><h3>Пауза</h3><button id="resume" class="btn primary">Продолжить</button><button id="restart" class="btn">Новая партия</button><button id="home" class="btn">В меню</button></div><div id="loading" class="loading">Загружаем 3D-стол…</div></section><script src="https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.min.js"></script><script>(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],sleep=m=>new Promise(r=>setTimeout(r,m));const names=['Вы','Запад','Север','Восток'],suits=[['clubs','♣'],['diamonds','♦'],['spades','♠'],['hearts','♥']];let difficulty='normal',scores=[0,0,0,0],round=1,S={},scene,camera,renderer,raycaster,pointer,handMeshes=[],trickMeshes=[],drag=null,busy=false,ready3d=false;const cardGeo=new THREE.PlaneGeometry(1,1.46);function show(id){$$('.screen').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on')}function makeDeck(){let a=[];for(const [s,u] of suits)for(let v=2;v<=14;v++)a.push({id:s+v,suit:s,sym:u,value:v,rank:v<11?''+v:({11:'J',12:'Q',13:'K',14:'A'}[v])});for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function pts(c){return c.suit==='hearts'?1:(c.suit==='spades'&&c.value===12?13:0)}function resetState(){let d=makeDeck(),h=[[],[],[],[]];d.forEach((c,i)=>h[i%4].push(c));h.forEach(x=>x.sort((a,b)=>suits.findIndex(z=>z[0]===a.suit)-suits.findIndex(z=>z[0]===b.suit)||a.value-b.value));let starter=h.findIndex(x=>x.some(c=>c.suit==='clubs'&&c.value===2));S={h,trick:[],rscore:[0,0,0,0],player:starter,leader:starter,tno:0,broken:false,over:false}}function legal(p){let h=S.h[p];if(!S.trick.length){let two=h.find(c=>c.suit==='clubs'&&c.value===2);if(S.tno===0&&two)return[two];if(!S.broken){let n=h.filter(c=>c.suit!=='hearts');if(n.length)return n}return h}let lead=S.trick[0].card.suit,same=h.filter(c=>c.suit===lead);if(same.length)return same;if(S.tno===0){let clean=h.filter(c=>!pts(c));if(clean.length)return clean}return h}function cardTexture(c,back=false){let cv=document.createElement('canvas');cv.width=256;cv.height=374;let x=cv.getContext('2d');x.fillStyle=back?'#7f1d3f':'#f8f8f5';x.fillRect(0,0,256,374);x.strokeStyle=back?'#f5b7c8':'#d7d7d2';x.lineWidth=8;x.strokeRect(8,8,240,358);if(back){x.strokeStyle='#ffffff55';x.lineWidth=3;for(let i=24;i<232;i+=24){x.beginPath();x.moveTo(i,20);x.lineTo(236,360-i*.3);x.stroke()}x.fillStyle='#ffffffcc';x.font='72px -apple-system';x.textAlign='center';x.fillText('♥',128,210)}else{let red=c.suit==='hearts'||c.suit==='diamonds';x.fillStyle=red?'#d7264e':'#141414';x.textAlign='left';x.font='bold 58px -apple-system';x.fillText(c.rank,22,68);x.font='48px -apple-system';x.fillText(c.sym,24,116);x.textAlign='center';x.font='116px -apple-system';x.fillText(c.sym,128,245)}let t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t}const backMat=()=>new THREE.MeshStandardMaterial({map:cardTexture(null,true),roughness:.72,metalness:0,side:THREE.DoubleSide});function meshFor(c,back=false){let m=new THREE.Mesh(cardGeo,new THREE.MeshStandardMaterial({map:cardTexture(c,back),roughness:.68,metalness:0,side:THREE.DoubleSide}));m.userData.card=c;m.castShadow=true;m.receiveShadow=true;return m}function init3d(){scene=new THREE.Scene();scene.background=new THREE.Color(0x061812);camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,7.4,10.8);camera.lookAt(0,.25,0);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;$('#stage').appendChild(renderer.domElement);raycaster=new THREE.Raycaster();pointer=new THREE.Vector2();let amb=new THREE.HemisphereLight(0xdfffea,0x102019,1.7);scene.add(amb);let key=new THREE.DirectionalLight(0xfff5dc,3.1);key.position.set(-4,8,6);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);let table=new THREE.Mesh(new THREE.CylinderGeometry(6.2,6.35,.34,64),new THREE.MeshStandardMaterial({color:0x0d624b,roughness:.93}));table.position.y=-.24;table.receiveShadow=true;scene.add(table);let rim=new THREE.Mesh(new THREE.TorusGeometry(6.05,.16,16,64),new THREE.MeshStandardMaterial({color:0x173b32,roughness:.7,metalness:.08}));rim.rotation.x=Math.PI/2;rim.position.y=-.02;scene.add(rim);ready3d=true;$('#loading').classList.add('hidden');renderer.domElement.addEventListener('pointerdown',down,{passive:false});renderer.domElement.addEventListener('pointermove',move,{passive:false});renderer.domElement.addEventListener('pointerup',up,{passive:false});renderer.domElement.addEventListener('pointercancel',cancel,{passive:false});addEventListener('resize',resize);animate()}function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}function ease(t){return 1-Math.pow(1-t,3)}function tweenMesh(m,to,dur=380,arc=.45){let from={p:m.position.clone(),q:m.quaternion.clone(),s:m.scale.clone()},start=performance.now();let tq=new THREE.Quaternion().setFromEuler(new THREE.Euler(to.rx??m.rotation.x,to.ry??m.rotation.y,to.rz??m.rotation.z));return new Promise(res=>{function f(now){let t=Math.min(1,(now-start)/dur),e=ease(t);m.position.lerpVectors(from.p,new THREE.Vector3(to.x,to.y,to.z),e);m.position.y+=Math.sin(Math.PI*t)*arc;THREE.Quaternion.slerp(from.q,tq,m.quaternion,e);if(t<1)requestAnimationFrame(f);else{m.position.set(to.x,to.y,to.z);m.quaternion.copy(tq);res()}}requestAnimationFrame(f)})}function handPose(i,n){let spread=Math.min(5.9,.53*(n-1)),x=n===1?0:-spread/2+i*(spread/(n-1)),edge=Math.abs(x)/(spread/2||1);return{x,y:.55+edge*.08,z:4.05+edge*.25,rx:-1.16,ry:0,rz:-x*.045}}async function layoutHand(animated=true){let n=handMeshes.length;await Promise.all(handMeshes.map((m,i)=>{let p=handPose(i,n);m.renderOrder=i;m.userData.home=p;return animated?tweenMesh(m,p,260,.1):(m.position.set(p.x,p.y,p.z),m.rotation.set(p.rx,p.ry,p.rz),Promise.resolve())}))}function setLegalVisuals(){let ok=new Set(legal(0).map(c=>c.id));handMeshes.forEach(m=>{let yes=S.player===0&&ok.has(m.userData.card.id);m.material.color.set(yes?0xffffff:0x8d9692);m.material.opacity=yes?1:.55;m.material.transparent=!yes})}function updateUI(){[1,2,3].forEach(i=>{let e=$(`[data-seat="${i}"]`);e.classList.toggle('active',S.player===i);e.querySelector('small').textContent=S.h[i].length});$('#turn').textContent=S.player===0?'Ваш ход':'Ход: '+names[S.player];$('#hint').textContent=S.player===0?'Смахните разрешённую карту вверх':'Думает '+names[S.player]+'…';setLegalVisuals()}function clearVisuals(){[...handMeshes,...trickMeshes].forEach(m=>{scene.remove(m);m.material.map?.dispose();m.material.dispose()});handMeshes=[];trickMeshes=[]}async function deal(){clearVisuals();$('#hint').textContent='Раздаём карты…';$('#turn').textContent='Раздача…';let deckStack=[];for(let k=0;k<5;k++){let b=meshFor(null,true);b.position.set(0,.12+k*.012,.15);b.rotation.set(-Math.PI/2,0,(k-2)*.01);scene.add(b);deckStack.push(b)}const targets=[new THREE.Vector3(0,.4,4.4),new THREE.Vector3(-5,.25,.2),new THREE.Vector3(0,.2,-4.5),new THREE.Vector3(5,.25,.2)];for(let i=0;i<52;i++){let p=i%4,m=meshFor(null,true);m.position.set(0,.24,.15);m.rotation.x=-Math.PI/2;scene.add(m);let t=targets[p].clone();t.x+=(Math.random()-.5)*.25;t.z+=(Math.random()-.5)*.18;await tweenMesh(m,{x:t.x,y:t.y,z:t.z,rx:-Math.PI/2,ry:0,rz:(Math.random()-.5)*.2},78,.22);scene.remove(m);m.material.map.dispose();m.material.dispose()}deckStack.forEach(m=>{scene.remove(m);m.material.map.dispose();m.material.dispose()});S.h[0].forEach(c=>{let m=meshFor(c,false);m.position.set(0,.35,.15);scene.add(m);handMeshes.push(m)});await layoutHand(false);for(let i=0;i<handMeshes.length;i++){let m=handMeshes[i],p=handPose(i,handMeshes.length);m.position.set(0,.28,.15);m.rotation.set(-Math.PI/2,0,0);await tweenMesh(m,p,95,.28)}updateUI()}function ndc(e){let r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1}function down(e){if(busy||S.player!==0||drag)return;ndc(e);raycaster.setFromCamera(pointer,camera);let ok=new Set(legal(0).map(c=>c.id)),hits=raycaster.intersectObjects(handMeshes.filter(m=>ok.has(m.userData.card.id)),false);if(!hits.length)return;e.preventDefault();let m=hits[0].object;drag={m,startX:e.clientX,startY:e.clientY,home:{...m.userData.home}};renderer.domElement.setPointerCapture?.(e.pointerId);m.renderOrder=999;m.position.y+=.18}function move(e){if(!drag)return;e.preventDefault();let dx=e.clientX-drag.startX,dy=e.clientY-drag.startY,m=drag.m;m.position.x=drag.home.x+dx*.010;m.position.z=drag.home.z+dy*.014;m.position.y=drag.home.y+.18+Math.max(0,-dy)*.004;m.rotation.z=drag.home.rz-dx*.0018;m.rotation.x=-1.05}async function up(e){if(!drag)return;e.preventDefault();let d=drag;drag=null;let dy=e.clientY-d.startY;if(dy<-48){await playerPlay(d.m)}else await tweenMesh(d.m,d.home,220,.08)}function cancel(){if(!drag)return;let d=drag;drag=null;tweenMesh(d.m,d.home,220,.08)}async function playerPlay(m){if(busy)return;let c=m.userData.card;if(!legal(0).some(x=>x.id===c.id))return;busy=true;let idx=handMeshes.indexOf(m);if(idx>=0)handMeshes.splice(idx,1);S.h[0]=S.h[0].filter(x=>x.id!==c.id);let slot=trickPos(0,S.trick.length);await Promise.all([tweenMesh(m,slot,330,.65),layoutHand(true)]);m.userData.owner=0;trickMeshes.push(m);commitPlay(0,c);busy=false;await afterPlay()}function trickPos(p,k){let P=[{x:0,y:.42,z:1.15,rz:-.04},{x:-1.2,y:.42,z:.15,rz:.08},{x:0,y:.42,z:-1.0,rz:-.05},{x:1.2,y:.42,z:.15,rz:.06}][p];return{x:P.x,y:P.y+.015*k,z:P.z,rx:-Math.PI/2,ry:0,rz:P.rz}}function seatPos(p){return[{x:0,y:.38,z:4.6,rz:0},{x:-5,y:.28,z:.1,rz:-Math.PI/2},{x:0,y:.25,z:-4.6,rz:Math.PI},{x:5,y:.28,z:.1,rz:Math.PI/2}][p]}async function aiPlay(){if(busy||S.player===0||S.over)return;busy=true;let p=S.player,c=pick(p),m=meshFor(c,false),s=seatPos(p);m.position.set(s.x,s.y,s.z);m.rotation.set(-Math.PI/2,0,s.rz);scene.add(m);S.h[p]=S.h[p].filter(x=>x.id!==c.id);await tweenMesh(m,trickPos(p,S.trick.length),350,.7);m.userData.owner=p;trickMeshes.push(m);commitPlay(p,c);busy=false;await afterPlay()}function commitPlay(p,c){if(c.suit==='hearts')S.broken=true;S.trick.push({player:p,card:c});}async function afterPlay(){if(S.trick.length===4)return finishTrick();S.player=(S.player+1)%4;updateUI();if(S.player!==0)setTimeout(aiPlay,450)}async function finishTrick(){let lead=S.trick[0].card.suit,w=S.trick.filter(x=>x.card.suit===lead).reduce((a,b)=>a.card.value>b.card.value?a:b).player,pp=S.trick.reduce((a,x)=>a+pts(x.card),0);S.rscore[w]+=pp;$('#hint').textContent=names[w]+' берёт взятку'+(pp?' · +'+pp:'');let target=seatPos(w);await Promise.all(trickMeshes.map((m,i)=>tweenMesh(m,{x:target.x+(i-1.5)*.05,y:target.y+.12+i*.01,z:target.z,rx:-Math.PI/2,ry:0,rz:target.rz},420,.5)));trickMeshes.forEach(m=>{scene.remove(m);m.material.map.dispose();m.material.dispose()});trickMeshes=[];S.trick=[];S.tno++;S.player=S.leader=w;if(S.h.every(x=>x.length===0))return finishRound();updateUI();if(S.player!==0)setTimeout(aiPlay,500)}function pick(p){let L=legal(p);if(difficulty==='easy')return L[Math.floor(Math.random()*L.length)];if(S.trick.length){let lead=S.trick[0].card.suit,top=S.trick.filter(x=>x.card.suit===lead).sort((a,b)=>b.card.value-a.card.value)[0];if(L[0].suit===lead){let lose=L.filter(c=>c.value<top.card.value).sort((a,b)=>b.value-a.value);if(lose.length)return lose[0];return [...L].sort((a,b)=>a.value-b.value)[0]}}let q=L.find(c=>c.suit==='spades'&&c.value===12);if(q)return q;let h=L.filter(c=>c.suit==='hearts').sort((a,b)=>b.value-a.value);if(h.length)return h[0];return [...L].sort((a,b)=>difficulty==='hard'?b.value-a.value:a.value-b.value)[0]}async function finishRound(){S.over=true;let moon=S.rscore.findIndex(x=>x===26);if(moon>=0)S.rscore=S.rscore.map((_,i)=>i===moon?0:26);scores=scores.map((x,i)=>x+S.rscore[i]);$('#myscore').textContent=scores[0];$('#hint').textContent='Раунд завершён';await sleep(1100);round++;$('#round').textContent=round;resetState();await deal();S.over=false;updateUI();if(S.player!==0)setTimeout(aiPlay,500)}async function start(){if(!ready3d)init3d();scores=[0,0,0,0];round=1;$('#round').textContent=1;$('#myscore').textContent=0;show('game');resetState();await deal();updateUI();if(S.player!==0)setTimeout(aiPlay,500)}$('#start').onclick=start;$('#openSettings').onclick=()=>show('settings');$('#back').onclick=()=>show('welcome');$$('[data-d]').forEach(b=>b.onclick=()=>{$$('[data-d]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');difficulty=b.dataset.d});$('#menu').onclick=()=>{$('#sheet').classList.remove('hidden');busy=true};$('#resume').onclick=()=>{$('#sheet').classList.add('hidden');busy=false;updateUI();if(S.player!==0)setTimeout(aiPlay,300)};$('#restart').onclick=async()=>{$('#sheet').classList.add('hidden');busy=true;scores=[0,0,0,0];round=1;$('#round').textContent=1;$('#myscore').textContent=0;resetState();await deal();busy=false;updateUI();if(S.player!==0)setTimeout(aiPlay,500)};$('#home').onclick=()=>{S.over=true;busy=false;show('welcome')};document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});let lastTouch=0;document.addEventListener('touchend',e=>{let now=Date.now();if(now-lastTouch<320)e.preventDefault();lastTouch=now},{passive:false})})();</script></body></html>
