<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Черви · v0.5.0</title>
<style>
:root{--bg:#090a0a;--panel:#111313;--line:#ffffff12;--muted:#8f9692;--white:#f5f6f4;--heart:#ff4968;--felt:#164f3e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;overscroll-behavior:none}
body{position:fixed;inset:0}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.screen{position:fixed;inset:0;display:none}.screen.on{display:block}
.welcome{padding:max(28px,env(safe-area-inset-top)) 22px max(26px,env(safe-area-inset-bottom));background:#090a0a}.welcome.on{display:flex;align-items:center;justify-content:center}
.hero{width:min(88vw,380px);text-align:center}.mark{width:72px;height:72px;margin:0 auto 26px;border-radius:22px;background:#171919;border:1px solid #ffffff12;display:grid;place-items:center;font-size:38px;color:var(--heart);box-shadow:0 22px 70px #000}
.hero h1{font-size:52px;line-height:.95;letter-spacing:-2.4px;margin:0}.hero p{margin:13px 0 34px;color:var(--muted);font-size:15px}
.btn{width:100%;height:58px;border-radius:18px;margin-top:10px;background:#171919;border:1px solid var(--line);font-size:16px;font-weight:750}.btn:active{transform:scale(.985)}.primary{background:var(--white);color:#090a0a;border-color:transparent}
.settings{padding:max(18px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));background:#090a0a}.settings h2{font-size:34px;letter-spacing:-1.2px;margin:28px 0}.back{width:46px;height:46px;border-radius:14px;background:#171919;font-size:28px}.cardpanel{padding:20px;border:1px solid var(--line);border-radius:22px;background:#111313}.label{font-size:12px;color:var(--muted);margin-bottom:12px}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;border-radius:15px;background:#090a0a}.seg button{height:44px;border-radius:11px;background:transparent;color:#838a86;font-weight:700}.seg .sel{background:#252827;color:#fff}
#game{background:#090a0a;touch-action:none}#stage{position:absolute;inset:0;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}
.topbar{position:absolute;z-index:20;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;height:52px;display:flex;align-items:center;pointer-events:none}.topbar button{pointer-events:auto;width:42px;height:42px;border-radius:14px;background:#101212cc;border:1px solid var(--line);backdrop-filter:blur(16px)}
.gameinfo{margin-left:12px;font-size:11px;color:#a0a6a2}.gameinfo b{display:block;color:#fff;font-size:13px;margin-top:2px}.score{margin-left:auto;text-align:right;font-size:11px;color:#a0a6a2}.score b{display:block;color:#fff;font-size:18px;line-height:1.05}
.seat{position:absolute;z-index:12;text-align:center;font-size:10px;color:#9ca39f;pointer-events:none}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;margin:0 auto 5px;background:#171a19;border:1px solid #ffffff14;color:#dfe3e0;font-weight:800;transition:.2s}.seat.active .avatar{border-color:#ffffff60;box-shadow:0 0 0 3px #ffffff0b}.seat small{display:block;color:#686e6b;margin-top:2px}.north{top:max(78px,calc(env(safe-area-inset-top) + 72px));left:50%;transform:translateX(-50%)}.west{left:12px;top:43%;transform:translateY(-50%)}.east{right:12px;top:43%;transform:translateY(-50%)}
.hint{position:absolute;z-index:20;left:50%;bottom:calc(164px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:86vw;padding:9px 13px;border-radius:999px;background:#101212d9;border:1px solid var(--line);backdrop-filter:blur(16px);font-size:11px;font-weight:700;white-space:nowrap;pointer-events:none}
.version{position:absolute;z-index:25;right:10px;bottom:max(8px,env(safe-area-inset-bottom));font-size:9px;color:#626864;letter-spacing:.35px;pointer-events:none}
.sheet{position:absolute;z-index:50;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));padding:18px;border-radius:24px;background:#111313f2;border:1px solid #ffffff14;backdrop-filter:blur(22px)}.sheet h3{margin:0 0 8px;font-size:22px}.hidden{display:none!important}
.loading{position:absolute;z-index:60;inset:0;background:#090a0a;display:grid;place-items:center;text-align:center;font-size:13px;color:#8f9692;padding:30px}.loading b{display:block;color:#fff;font-size:18px;margin-bottom:6px}
.dealstatus{position:absolute;z-index:18;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;color:#cbd0cd;pointer-events:none}
</style>
</head>
<body>
<section id="welcome" class="screen welcome on"><div class="hero"><div class="mark">♥</div><h1>Черви</h1><p>Тихая классика. Настоящий 3D-стол.</p><button id="start" class="btn primary">Начать игру</button><button id="openSettings" class="btn">Настройки</button><div style="margin-top:18px;font-size:10px;color:#505653">v0.5.0 · 3D ALPHA</div></div></section>
<section id="settings" class="screen settings"><button id="back" class="back">‹</button><h2>Настройки</h2><div class="cardpanel"><div class="label">СЛОЖНОСТЬ ИИ</div><div class="seg"><button data-d="easy">Легко</button><button data-d="normal" class="sel">Нормально</button><button data-d="hard">Сложно</button></div></div></section>
<section id="game" class="screen"><div id="stage"></div><div class="topbar"><button id="menu">•••</button><div class="gameinfo">РАУНД <b id="round">1</b></div><div class="score">ВАШ СЧЁТ <b id="myscore">0</b></div></div><div class="seat north" data-seat="2"><div class="avatar">N</div>Север<small>13 карт</small></div><div class="seat west" data-seat="1"><div class="avatar">W</div>Запад<small>13 карт</small></div><div class="seat east" data-seat="3"><div class="avatar">E</div>Восток<small>13 карт</small></div><div id="hint" class="hint">Подготовка стола…</div><div id="dealstatus" class="dealstatus hidden">Раздача…</div><div class="version">v0.5.0 · 3D ALPHA</div><div id="sheet" class="sheet hidden"><h3>Пауза</h3><button id="resume" class="btn primary">Продолжить</button><button id="restart" class="btn">Новая партия</button><button id="home" class="btn">В меню</button></div><div id="loading" class="loading hidden"><div><b>3D недоступен</b>Не удалось загрузить графический движок. Обновите страницу.</div></div></section>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],sleep=m=>new Promise(r=>setTimeout(r,m));
const names=['Вы','Запад','Север','Восток'], suits=[['clubs','♣'],['diamonds','♦'],['spades','♠'],['hearts','♥']];
let difficulty='normal',scores=[0,0,0,0],round=1,S={};
let scene,camera,renderer,raycaster,pointer,cardGeo,handMeshes=[],trickMeshes=[],drag=null,busy=false,ready3d=false,animating=false;
function show(id){$$('.screen').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on')}
function makeDeck(){let a=[];for(const [s,u] of suits)for(let v=2;v<=14;v++)a.push({id:s+v,suit:s,sym:u,value:v,rank:v<11?String(v):({11:'J',12:'Q',13:'K',14:'A'}[v])});for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pts(c){return c.suit==='hearts'?1:(c.suit==='spades'&&c.value===12?13:0)}
function resetState(){let d=makeDeck(),h=[[],[],[],[]];d.forEach((c,i)=>h[i%4].push(c));h.forEach(x=>x.sort((a,b)=>suits.findIndex(z=>z[0]===a.suit)-suits.findIndex(z=>z[0]===b.suit)||a.value-b.value));let starter=h.findIndex(x=>x.some(c=>c.suit==='clubs'&&c.value===2));S={h,trick:[],rscore:[0,0,0,0],player:starter,leader:starter,tno:0,broken:false,over:false}}
function legal(p){let h=S.h[p];if(!S.trick.length){let two=h.find(c=>c.suit==='clubs'&&c.value===2);if(S.tno===0&&two)return[two];if(!S.broken){let n=h.filter(c=>c.suit!=='hearts');if(n.length)return n}return h}let lead=S.trick[0].card.suit,same=h.filter(c=>c.suit===lead);if(same.length)return same;if(S.tno===0){let clean=h.filter(c=>!pts(c));if(clean.length)return clean}return h}
function cardTexture(c,back=false){let cv=document.createElement('canvas');cv.width=256;cv.height=374;let x=cv.getContext('2d');x.fillStyle=back?'#242827':'#f7f7f3';x.fillRect(0,0,256,374);x.strokeStyle=back?'#4c5350':'#dedfd9';x.lineWidth=7;x.strokeRect(8,8,240,358);if(back){x.fillStyle='#ff4968';x.font='68px -apple-system';x.textAlign='center';x.fillText('♥',128,214);x.strokeStyle='#ffffff12';x.lineWidth=2;for(let i=-150;i<320;i+=26){x.beginPath();x.moveTo(i,0);x.lineTo(i+250,374);x.stroke()}}else{let red=c.suit==='hearts'||c.suit==='diamonds';x.fillStyle=red?'#e83354':'#141515';x.textAlign='left';x.font='700 56px -apple-system';x.fillText(c.rank,20,66);x.font='46px -apple-system';x.fillText(c.sym,22,115);x.textAlign='center';x.font='110px -apple-system';x.fillText(c.sym,128,250)}let t=new THREE.CanvasTexture(cv);t.anisotropy=2;return t}
function meshFor(c,back=false){let mat=new THREE.MeshStandardMaterial({map:cardTexture(c,back),roughness:.72,metalness:0,side:THREE.DoubleSide,transparent:true});let m=new THREE.Mesh(cardGeo,mat);m.userData.card=c;m.castShadow=true;m.receiveShadow=true;return m}
function init3d(){if(ready3d)return true;if(!window.THREE){$('#loading').classList.remove('hidden');return false}try{scene=new THREE.Scene();scene.background=new THREE.Color(0x090a0a);camera=new THREE.PerspectiveCamera(37,innerWidth/innerHeight,.1,100);camera.position.set(0,4.65,9.65);camera.lookAt(0,-.15,-.75);renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.domElement.style.touchAction='none';$('#stage').appendChild(renderer.domElement);raycaster=new THREE.Raycaster();pointer=new THREE.Vector2();cardGeo=new THREE.PlaneGeometry(1,1.46);scene.add(new THREE.HemisphereLight(0xeaf4ef,0x080908,1.18));let key=new THREE.DirectionalLight(0xfff7e8,2.25);key.position.set(-4,7,5);key.castShadow=true;key.shadow.mapSize.width=1024;key.shadow.mapSize.height=1024;scene.add(key);let fill=new THREE.PointLight(0xd7fff0,.55,16);fill.position.set(4,3,3);scene.add(fill);let table=new THREE.Mesh(new THREE.CylinderGeometry(5.85,6.0,.34,64),new THREE.MeshStandardMaterial({color:0x164f3e,roughness:.96,metalness:0}));table.position.set(0,-.34,-.55);table.receiveShadow=true;scene.add(table);let rim=new THREE.Mesh(new THREE.TorusGeometry(5.77,.12,14,72),new THREE.MeshStandardMaterial({color:0x252a28,roughness:.75}));rim.rotation.x=Math.PI/2;rim.position.set(0,-.13,-.55);scene.add(rim);renderer.domElement.addEventListener('pointerdown',down,{passive:false});renderer.domElement.addEventListener('pointermove',move,{passive:false});renderer.domElement.addEventListener('pointerup',up,{passive:false});renderer.domElement.addEventListener('pointercancel',cancel,{passive:false});addEventListener('resize',resize);ready3d=true;renderLoop();return true}catch(err){console.error(err);$('#loading').classList.remove('hidden');return false}}
function renderLoop(){if(!ready3d)return;requestAnimationFrame(renderLoop);renderer.render(scene,camera)}
function resize(){if(!ready3d)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function cubic(t){return 1-Math.pow(1-t,3)}
function tween(m,to,dur=360,arc=.25){let fp=m.position.clone(),fq=m.quaternion.clone(),start=performance.now(),tv=new THREE.Vector3(to.x,to.y,to.z),tq=new THREE.Quaternion().setFromEuler(new THREE.Euler(to.rx??m.rotation.x,to.ry??m.rotation.y,to.rz??m.rotation.z));return new Promise(resolve=>{function step(now){let t=Math.min(1,(now-start)/dur),e=cubic(t);m.position.lerpVectors(fp,tv,e);m.position.y+=Math.sin(Math.PI*t)*arc;THREE.Quaternion.slerp(fq,tq,m.quaternion,e);if(t<1)requestAnimationFrame(step);else{m.position.copy(tv);m.quaternion.copy(tq);resolve()}}requestAnimationFrame(step)})}
function handPose(i,n){let spread=Math.min(6.0,.54*(n-1)),x=n===1?0:-spread/2+i*(spread/(n-1)),edge=Math.abs(x)/(spread/2||1);return{x,y:.18+edge*.05,z:3.72+edge*.34,rx:-.88,ry:0,rz:-x*.052}}
function layoutHand(animated=true){let n=handMeshes.length;return Promise.all(handMeshes.map((m,i)=>{let p=handPose(i,n);m.userData.home=p;m.renderOrder=i;return animated?tween(m,p,250,.08):(m.position.set(p.x,p.y,p.z),m.rotation.set(p.rx,p.ry,p.rz),Promise.resolve())}))}
function clearVisuals(){[...handMeshes,...trickMeshes].forEach(dispose);handMeshes=[];trickMeshes=[]}
function dispose(m){if(!m)return;scene?.remove(m);m.material?.map?.dispose();m.material?.dispose()}
function seatTarget(p){return[{x:0,y:.12,z:4.15,rz:0},{x:-4.65,y:.06,z:-.2,rz:-Math.PI/2},{x:0,y:.04,z:-4.25,rz:Math.PI},{x:4.65,y:.06,z:-.2,rz:Math.PI/2}][p]}
async function deal(){busy=true;animating=true;clearVisuals();$('#dealstatus').classList.remove('hidden');$('#hint').textContent='Раздаём карты';let stack=[];for(let k=0;k<4;k++){let m=meshFor(null,true);m.position.set(.05*k,.02+k*.018,-.55);m.rotation.set(-Math.PI/2,0,.01*k);scene.add(m);stack.push(m)}let flights=[];for(let i=0;i<52;i++){let p=i%4,m=meshFor(null,true),t=seatTarget(p);m.position.set(0,.13,-.55);m.rotation.set(-Math.PI/2,0,0);m.scale.set(.98,.98,.98);scene.add(m);let tx=t.x+(Math.random()-.5)*.18,tz=t.z+(Math.random()-.5)*.14;flights.push(tween(m,{x:tx,y:t.y,z:tz,rx:-Math.PI/2,ry:0,rz:t.rz+(Math.random()-.5)*.08},330,.42).then(()=>dispose(m)));await sleep(24)}await Promise.all(flights);stack.forEach(dispose);S.h[0].forEach((c,i)=>{let m=meshFor(c,false),p=handPose(i,S.h[0].length);m.position.set(0,.1,-.45);m.rotation.set(-Math.PI/2,0,0);scene.add(m);handMeshes.push(m);setTimeout(()=>tween(m,p,380+i*8,.34),i*18)});await sleep(620);$('#dealstatus').classList.add('hidden');animating=false;busy=false;updateUI()}
function updateUI(){[1,2,3].forEach(i=>{let e=$(`[data-seat="${i}"]`);e.classList.toggle('active',S.player===i);e.querySelector('small').textContent=S.h[i].length+' карт'});let text=S.player===0?'Ваш ход':'Ход: '+names[S.player];$('#hint').textContent=S.player===0?'Смахните карту вверх':text;setLegalVisuals()}
function setLegalVisuals(){let ok=new Set(legal(0).map(c=>c.id));handMeshes.forEach(m=>{let yes=S.player===0&&ok.has(m.userData.card.id);m.material.opacity=yes?1:.42;m.material.color.set(yes?0xffffff:0x7d8581)})}
function ndc(e){let r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1}
function down(e){if(busy||animating||S.player!==0||drag)return;ndc(e);raycaster.setFromCamera(pointer,camera);let ok=new Set(legal(0).map(c=>c.id)),hits=raycaster.intersectObjects(handMeshes.filter(m=>ok.has(m.userData.card.id)),false);if(!hits.length)return;e.preventDefault();let m=hits[0].object;drag={m,startX:e.clientX,startY:e.clientY,home:{...m.userData.home},pointerId:e.pointerId};renderer.domElement.setPointerCapture?.(e.pointerId);m.position.y+=.2;m.renderOrder=999}
function move(e){if(!drag)return;e.preventDefault();let dx=e.clientX-drag.startX,dy=e.clientY-drag.startY,m=drag.m;m.position.x=drag.home.x+dx*.011;m.position.z=drag.home.z+dy*.013;m.position.y=drag.home.y+.2+Math.max(0,-dy)*.004;m.rotation.x=-.72;m.rotation.z=drag.home.rz-dx*.002}
async function up(e){if(!drag)return;e.preventDefault();let d=drag;drag=null;if(e.clientY-d.startY<-46)await playerPlay(d.m);else await tween(d.m,d.home,220,.07)}
function cancel(){if(!drag)return;let d=drag;drag=null;tween(d.m,d.home,220,.07)}
function trickPos(p,k){let a=[{x:0,z:.65,rz:-.03},{x:-.75,z:-.12,rz:.08},{x:0,z:-.85,rz:-.04},{x:.75,z:-.12,rz:.06}][p];return{x:a.x,y:.06+.015*k,z:a.z-.55,rx:-Math.PI/2,ry:0,rz:a.rz}}
async function playerPlay(m){let c=m.userData.card;if(busy||!legal(0).some(x=>x.id===c.id))return;busy=true;handMeshes=handMeshes.filter(x=>x!==m);S.h[0]=S.h[0].filter(x=>x.id!==c.id);await Promise.all([tween(m,trickPos(0,S.trick.length),330,.55),layoutHand(true)]);m.userData.owner=0;trickMeshes.push(m);commitPlay(0,c);busy=false;afterPlay()}
function pick(p){let L=legal(p);if(difficulty==='easy')return L[Math.floor(Math.random()*L.length)];if(S.trick.length){let lead=S.trick[0].card.suit,top=Math.max(...S.trick.filter(x=>x.card.suit===lead).map(x=>x.card.value)),same=L.filter(c=>c.suit===lead);if(same.length){let lose=same.filter(c=>c.value<top).sort((a,b)=>b.value-a.value);return lose[0]||same.sort((a,b)=>a.value-b.value)[0]}}let q=L.find(c=>c.suit==='spades'&&c.value===12);if(q)return q;let hearts=L.filter(c=>c.suit==='hearts').sort((a,b)=>b.value-a.value);if(hearts.length)return hearts[0];return [...L].sort((a,b)=>difficulty==='hard'?b.value-a.value:a.value-b.value)[0]}
async function aiPlay(){if(busy||S.player===0||S.over)return;busy=true;let p=S.player,c=pick(p),m=meshFor(c,false),s=seatTarget(p);m.position.set(s.x,s.y+.1,s.z);m.rotation.set(-Math.PI/2,0,s.rz);scene.add(m);S.h[p]=S.h[p].filter(x=>x.id!==c.id);await tween(m,trickPos(p,S.trick.length),350,.58);m.userData.owner=p;trickMeshes.push(m);commitPlay(p,c);busy=false;afterPlay()}
function commitPlay(p,c){if(c.suit==='hearts')S.broken=true;S.trick.push({player:p,card:c})}
function afterPlay(){if(S.trick.length===4){finishTrick();return}S.player=(S.player+1)%4;updateUI();if(S.player!==0)setTimeout(aiPlay,420)}
async function finishTrick(){busy=true;let lead=S.trick[0].card.suit,w=S.trick.filter(x=>x.card.suit===lead).reduce((a,b)=>a.card.value>b.card.value?a:b).player,pp=S.trick.reduce((n,x)=>n+pts(x.card),0);S.rscore[w]+=pp;$('#hint').textContent=names[w]+' берёт взятку'+(pp?' · +'+pp:'');await sleep(360);let t=seatTarget(w);await Promise.all(trickMeshes.map((m,i)=>tween(m,{x:t.x+(i-1.5)*.04,y:t.y+.08,z:t.z,rx:-Math.PI/2,ry:0,rz:t.rz},320,.35)));trickMeshes.forEach(dispose);trickMeshes=[];S.trick=[];S.tno++;S.player=S.leader=w;busy=false;if(S.h.every(x=>x.length===0)){finishRound();return}updateUI();if(S.player!==0)setTimeout(aiPlay,430)}
async function finishRound(){S.over=true;let moon=S.rscore.findIndex(x=>x===26);if(moon>=0)S.rscore=S.rscore.map((_,i)=>i===moon?0:26);scores=scores.map((x,i)=>x+S.rscore[i]);$('#myscore').textContent=scores[0];$('#hint').textContent='Раунд завершён';await sleep(1000);round++;$('#round').textContent=round;resetState();S.over=false;await deal();if(S.player!==0)setTimeout(aiPlay,450)}
async function start(){show('game');$('#loading').classList.add('hidden');if(!init3d())return;scores=[0,0,0,0];round=1;$('#round').textContent='1';$('#myscore').textContent='0';resetState();await deal();if(S.player!==0)setTimeout(aiPlay,450)}
$('#start').addEventListener('click',start);$('#openSettings').addEventListener('click',()=>show('settings'));$('#back').addEventListener('click',()=>show('welcome'));$$('[data-d]').forEach(b=>b.addEventListener('click',()=>{$$('[data-d]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');difficulty=b.dataset.d}));$('#menu').addEventListener('click',()=>{$('#sheet').classList.remove('hidden');busy=true});$('#resume').addEventListener('click',()=>{$('#sheet').classList.add('hidden');busy=false;updateUI();if(S.player!==0)setTimeout(aiPlay,300)});$('#restart').addEventListener('click',async()=>{$('#sheet').classList.add('hidden');busy=true;scores=[0,0,0,0];round=1;$('#round').textContent='1';$('#myscore').textContent='0';resetState();await deal();if(S.player!==0)setTimeout(aiPlay,450)});$('#home').addEventListener('click',()=>{S.over=true;busy=false;$('#sheet').classList.add('hidden');show('welcome')});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
})();
