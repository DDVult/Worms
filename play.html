<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#081b16"><title>Черви</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08110e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;-webkit-text-size-adjust:100%;touch-action:none}body{position:fixed;inset:0;overscroll-behavior:none}.screen{position:fixed;inset:0;display:none}.screen.on{display:block}button{font:inherit;color:inherit;border:0;touch-action:manipulation}.welcome{display:none!important;align-items:center;justify-content:center;padding:max(28px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 20%,#2a3049,#101522 45%,#070b12)}.welcome.on{display:flex!important}.panel{width:min(92vw,390px);padding:30px 24px;border-radius:30px;background:#ffffff10;border:1px solid #ffffff18;text-align:center;backdrop-filter:blur(22px);box-shadow:0 24px 70px #0007}.logo{width:88px;height:88px;border-radius:28px;display:grid;place-items:center;margin:-72px auto 18px;background:linear-gradient(145deg,#ff6581,#c62a51);font-size:48px;box-shadow:0 16px 44px #ff416744}.panel h1{font-size:48px;margin:0 0 8px}.panel p{color:#aab3c3}.btn{width:100%;min-height:56px;margin-top:10px;border-radius:17px;background:#ffffff14;font-weight:800;font-size:17px;border:1px solid #ffffff12}.primary{background:linear-gradient(#ff5878,#df355b)}.settings{padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));background:#0c1119;overflow:auto;touch-action:pan-y}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#ffffff10;padding:6px;border-radius:16px}.seg button{padding:12px;border-radius:12px;background:transparent}.seg .sel{background:#fff;color:#111}.game{height:100dvh;background:radial-gradient(ellipse at center,#167658,#0d513e 52%,#06261d);touch-action:none}.hud{position:absolute;z-index:20;left:10px;right:10px;top:max(8px,env(safe-area-inset-top));height:52px;border-radius:17px;background:#0c1514cc;border:1px solid #ffffff18;display:flex;align-items:center;padding:0 12px;gap:10px;backdrop-filter:blur(16px)}.turn{margin:auto;font-size:12px;font-weight:800}.score{font-size:12px;text-align:right}.opp{position:absolute;text-align:center;font-size:11px;pointer-events:none}.opp .av{width:42px;height:42px;border-radius:50%;background:#132a32;border:1px solid #ffffff25;display:grid;place-items:center;margin:auto;font-weight:900}.opp.top{top:max(76px,calc(env(safe-area-inset-top) + 70px));left:50%;transform:translateX(-50%)}.opp.left{left:12px;top:42%;transform:translateY(-50%)}.opp.right{right:12px;top:42%;transform:translateY(-50%)}.opp.active .av{box-shadow:0 0 0 2px #ffe96d,0 0 24px #ffe96d55}.trick{position:absolute;left:50%;top:46%;width:210px;height:190px;transform:translate(-50%,-50%);pointer-events:none}.slot{position:absolute;width:58px;height:84px}.slot[data-p="2"]{left:76px;top:0}.slot[data-p="0"]{left:76px;bottom:0}.slot[data-p="1"]{left:0;top:53px}.slot[data-p="3"]{right:0;top:53px}.msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:8px 10px;border-radius:12px;background:#03130ecc;font-size:10px;font-weight:800;white-space:nowrap}.hand{position:absolute;left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom));height:170px;touch-action:none}.card{position:absolute;width:60px;height:88px;border-radius:10px;background:linear-gradient(150deg,#fff,#edf0f4);color:#111;padding:6px;border:1px solid #0002;box-shadow:0 10px 20px #0007;transform-origin:50% 100%;transition:transform .18s ease,filter .18s,opacity .18s,left .18s;touch-action:none;will-change:transform}.card.red{color:#d9274c}.card b{font-size:17px;display:block;line-height:1}.card i{font-style:normal;font-size:18px}.card .pip{font-size:25px;text-align:center;margin-top:13px}.card.off{filter:brightness(.45) saturate(.45);opacity:.5}.card.selected{transform:translate3d(0,-22px,0) scale(1.05)!important;box-shadow:0 16px 30px #0009,0 0 0 2px #ffe96d}.tablecard{position:static;width:58px;height:84px;animation:land .18s ease}@keyframes land{from{transform:scale(.85);opacity:.6}to{transform:scale(1);opacity:1}}.deal{position:absolute;inset:0;z-index:50;background:#07100ddd;display:grid;place-items:center;pointer-events:none;overflow:hidden}.deck{width:78px;height:110px;border-radius:13px;background:linear-gradient(145deg,#b72e50,#6e172e);border:2px solid #ffffff35;display:grid;place-items:center;font-size:38px;box-shadow:0 15px 40px #0008}.fly{position:fixed;z-index:9999;width:60px;height:88px;border-radius:10px;pointer-events:none;will-change:transform,opacity;transition:transform .32s cubic-bezier(.22,.75,.2,1),opacity .28s}.deal-fly{background:linear-gradient(145deg,#9f2443,#64152c);border:1px solid #ffffff35;box-shadow:0 10px 25px #0008}.play-fly{background:linear-gradient(150deg,#fff,#edf0f4);color:#111;padding:6px;border:1px solid #0002;box-shadow:0 10px 25px #0008}.play-fly.red{color:#d9274c}.hidden{display:none!important}.sheet{position:absolute;z-index:80;inset:auto 14px max(14px,env(safe-area-inset-bottom));padding:16px;border-radius:22px;background:#111a18ee;border:1px solid #ffffff18;backdrop-filter:blur(18px)}.small{font-size:12px;color:#9fb0aa}</style></head><body><section id="welcome" class="screen welcome on"><div class="panel"><div class="logo">♥</div><h1>Черви</h1><p>Карточная игра для iPhone</p><button id="start" class="btn primary">Начать игру</button><button id="openSettings" class="btn">Настройки</button></div></section><section id="settings" class="screen settings"><button id="back" class="btn" style="width:58px">‹</button><h2>Настройки</h2><div class="panel" style="text-align:left;margin:auto"><h3>Сложность ИИ</h3><div class="seg"><button data-d="easy">Легко</button><button data-d="normal" class="sel">Нормально</button><button data-d="hard">Сложно</button></div><p class="small">Недоступные карты затемняются. Ход: потяни карту вверх на стол.</p></div></section><section id="game" class="screen game"><div class="hud"><button id="menu" style="width:38px;height:38px;border-radius:12px;background:#ffffff12">☰</button><div>Раунд <b id="round">1</b></div><div id="turn" class="turn">Раздача…</div><div class="score">Ваш счёт<br><b id="myscore">0</b></div></div><div class="opp top" data-o="2"><div class="av">ИИ</div><div>Север</div><small>13 карт</small></div><div class="opp left" data-o="1"><div class="av">ИИ</div><div>Запад</div><small>13 карт</small></div><div class="opp right" data-o="3"><div class="av">ИИ</div><div>Восток</div><small>13 карт</small></div><div class="trick"><div class="slot" data-p="0"></div><div class="slot" data-p="1"></div><div class="slot" data-p="2"></div><div class="slot" data-p="3"></div><div id="msg" class="msg">Раздаём карты…</div></div><div id="hand" class="hand"></div><div id="deal" class="deal"><div class="deck">♥</div></div><div id="sheet" class="sheet hidden"><h3>Пауза</h3><button id="resume" class="btn primary">Продолжить</button><button id="restart" class="btn">Новая партия</button><button id="home" class="btn">В меню</button></div></section><script>(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],sleep=m=>new Promise(r=>setTimeout(r,m));const names=['Вы','Запад','Север','Восток'],suits=[['clubs','♣'],['diamonds','♦'],['spades','♠'],['hearts','♥']];let difficulty='normal',scores=[0,0,0,0],round=1,S={},drag=null,lastTap=0;function show(id){$$('.screen').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on')}function makeDeck(){let a=[];for(const [s,u] of suits)for(let v=2;v<=14;v++)a.push({id:s+v,suit:s,sym:u,value:v,rank:v<11?''+v:({11:'J',12:'Q',13:'K',14:'A'}[v])});for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function pts(c){return c.suit==='hearts'?1:(c.suit==='spades'&&c.value===12?13:0)}function reset(){let d=makeDeck(),h=[[],[],[],[]];d.forEach((c,i)=>h[i%4].push(c));h.forEach(x=>x.sort((a,b)=>suits.findIndex(z=>z[0]===a.suit)-suits.findIndex(z=>z[0]===b.suit)||a.value-b.value));let starter=h.findIndex(x=>x.some(c=>c.suit==='clubs'&&c.value===2));S={h,trick:[],rscore:[0,0,0,0],player:starter,tno:0,broken:false,busy:true,over:false}}function markup(c,table=false){return `<div class="card ${c.suit==='hearts'||c.suit==='diamonds'?'red':''} ${table?'tablecard':''}"><b>${c.rank}</b><i>${c.sym}</i><div class="pip">${c.sym}</div></div>`}function legal(p){let h=S.h[p];if(!S.trick.length){let two=h.find(c=>c.suit==='clubs'&&c.value===2);if(S.tno===0&&two)return[two];if(!S.broken){let n=h.filter(c=>c.suit!=='hearts');if(n.length)return n}return h}let lead=S.trick[0].card.suit,same=h.filter(c=>c.suit===lead);if(same.length)return same;if(S.tno===0){let clean=h.filter(c=>!pts(c));if(clean.length)return clean}return h}function renderOpp(){[1,2,3].forEach(i=>{let e=$(`[data-o="${i}"]`);e.classList.toggle('active',S.player===i);e.querySelector('small').textContent=S.h[i].length+' карт'})}function renderHand(){let h=S.h[0],el=$('#hand');el.innerHTML='';let ok=new Set(legal(0).map(c=>c.id)),W=innerWidth,step=Math.min(30,(W-78)/Math.max(1,h.length-1)),total=60+step*(h.length-1),start=(W-total)/2;h.forEach((c,i)=>{let w=document.createElement('div');w.innerHTML=markup(c);let e=w.firstElementChild,rot=(i-(h.length-1)/2)*1.3;e.dataset.cardId=c.id;e.dataset.rot=rot;e.style.left=start+i*step+'px';e.style.bottom=Math.abs(i-(h.length-1)/2)*-.5+'px';e.style.zIndex=i+1;e.style.transform=`rotate(${rot}deg)`;if(S.player===0&&!ok.has(c.id))e.classList.add('off');el.appendChild(e)})}function cardAt(x,y){let els=document.elementsFromPoint(x,y);return els.find(e=>e.classList&&e.classList.contains('card')&&e.dataset.cardId)}function onStart(ev){if(ev.touches.length!==1)return;let t=ev.touches[0],e=cardAt(t.clientX,t.clientY);if(!e||S.busy||S.player!==0)return;let id=e.dataset.cardId;if(!legal(0).some(c=>c.id===id))return;drag={id,e,sy:t.clientY,y:t.clientY};e.classList.add('selected');ev.preventDefault()}function onMove(ev){if(!drag||ev.touches.length!==1)return;let y=ev.touches[0].clientY,dy=Math.max(-190,Math.min(0,y-drag.sy));drag.y=y;drag.e.style.transform=`translate3d(0,${dy}px,0) rotate(${drag.e.dataset.rot}deg) scale(1.05)`;ev.preventDefault()}function onEnd(ev){if(!drag)return;let d=drag;drag=null;d.e.classList.remove('selected');let dy=d.y-d.sy;if(dy<-42)play(0,d.id);else renderHand();ev.preventDefault()}function place(p,c){$(`.slot[data-p="${p}"]`).innerHTML=markup(c,true)}function clearTrick(){$$('.slot').forEach(e=>e.innerHTML='')}function update(){renderOpp();renderHand();$('#turn').textContent=S.player===0?'Ваш ход':'Ход: '+names[S.player];$('#msg').textContent=S.player===0?(S.trick.length?'Ваш ход':'Вы начинаете'):'Думает '+names[S.player]+'…'}function sourceRect(p,id){if(p===0){let e=$(`[data-card-id="${id}"]`);if(e)return e.getBoundingClientRect()}let e=$(`[data-o="${p}"] .av`);return e?e.getBoundingClientRect():{left:innerWidth/2-30,top:innerHeight/2-44}}async function animatePlay(p,c){let sr=sourceRect(p,c.id),tr=$(`.slot[data-p="${p}"]`).getBoundingClientRect(),f=document.createElement('div');f.className='fly play-fly '+((c.suit==='hearts'||c.suit==='diamonds')?'red':'');f.innerHTML=`<b>${c.rank}</b><i>${c.sym}</i><div class="pip">${c.sym}</div>`;f.style.left=sr.left+'px';f.style.top=sr.top+'px';document.body.appendChild(f);requestAnimationFrame(()=>requestAnimationFrame(()=>f.style.transform=`translate3d(${tr.left-sr.left}px,${tr.top-sr.top}px,0) scale(.98)`));await sleep(330);f.remove()}async function play(p,id){if(S.busy)return;let c=S.h[p].find(x=>x.id===id);if(!c||!legal(p).some(x=>x.id===id))return;S.busy=true;await animatePlay(p,c);S.h[p]=S.h[p].filter(x=>x.id!==id);if(c.suit==='hearts')S.broken=true;S.trick.push({player:p,card:c});place(p,c);renderHand();renderOpp();await sleep(100);if(S.trick.length===4)return finishTrick();S.player=(p+1)%4;S.busy=false;update();if(S.player!==0)setTimeout(ai,420)}async function finishTrick(){let lead=S.trick[0].card.suit,w=S.trick.filter(x=>x.card.suit===lead).reduce((a,b)=>a.card.value>b.card.value?a:b).player,p=S.trick.reduce((a,x)=>a+pts(x.card),0);S.rscore[w]+=p;$('#msg').textContent=names[w]+' берёт взятку'+(p?' · +'+p:'');await sleep(650);clearTrick();S.trick=[];S.tno++;S.player=w;if(S.h.every(x=>x.length===0))return finishRound();S.busy=false;update();if(w!==0)setTimeout(ai,420)}function pick(p){let L=legal(p);if(difficulty==='easy')return L[Math.floor(Math.random()*L.length)];if(S.trick.length){let lead=S.trick[0].card.suit,top=Math.max(...S.trick.filter(x=>x.card.suit===lead).map(x=>x.card.value));let safe=L.filter(c=>c.suit===lead&&c.value<top).sort((a,b)=>b.value-a.value);if(safe.length)return safe[0]}let q=L.find(c=>c.suit==='spades'&&c.value===12);if(q)return q;return [...L].sort((a,b)=>difficulty==='hard'?b.value-a.value:a.value-b.value)[0]}function ai(){if(S.busy||S.player===0||S.over)return;let c=pick(S.player);play(S.player,c.id)}async function finishRound(){S.over=true;let moon=S.rscore.findIndex(x=>x===26);if(moon>=0)S.rscore=S.rscore.map((_,i)=>i===moon?0:26);scores=scores.map((x,i)=>x+S.rscore[i]);$('#myscore').textContent=scores[0];$('#msg').textContent='Раунд завершён';await sleep(900);round++;$('#round').textContent=round;reset();await deal();S.busy=false;S.over=false;update();if(S.player!==0)setTimeout(ai,420)}function targetForDeal(p){if(p===0)return{left:innerWidth/2-30,top:innerHeight-112};let r=$(`[data-o="${p}"] .av`).getBoundingClientRect();return{left:r.left-9,top:r.top-22}}async function deal(){$('#deal').classList.remove('hidden');$('#turn').textContent='Раздача…';$('#msg').textContent='Раздаём карты…';await sleep(180);let r=$('.deck').getBoundingClientRect();for(let i=0;i<52;i++){let p=i%4,t=targetForDeal(p),f=document.createElement('div');f.className='fly deal-fly';f.style.left=(r.left+9)+'px';f.style.top=(r.top+11)+'px';document.body.appendChild(f);requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transform=`translate3d(${t.left-(r.left+9)}px,${t.top-(r.top+11)}px,0) rotate(${(p-1.5)*5}deg) scale(.78)`;f.style.opacity='.12'}));setTimeout(()=>f.remove(),360);await sleep(26)}await sleep(260);$('#deal').classList.add('hidden');renderHand();renderOpp()}async function start(){scores=[0,0,0,0];round=1;$('#round').textContent=1;$('#myscore').textContent=0;show('game');reset();await deal();S.busy=false;update();if(S.player!==0)setTimeout(ai,420)}$('#hand').addEventListener('touchstart',onStart,{passive:false});$('#hand').addEventListener('touchmove',onMove,{passive:false});$('#hand').addEventListener('touchend',onEnd,{passive:false});$('#hand').addEventListener('touchcancel',onEnd,{passive:false});$('#start').onclick=start;$('#openSettings').onclick=()=>show('settings');$('#back').onclick=()=>show('welcome');$$('[data-d]').forEach(b=>b.onclick=()=>{$$('[data-d]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');difficulty=b.dataset.d});$('#menu').onclick=()=>{$('#sheet').classList.remove('hidden');S.busy=true};$('#resume').onclick=()=>{$('#sheet').classList.add('hidden');S.busy=false;update();if(S.player!==0)setTimeout(ai,300)};$('#restart').onclick=start;$('#home').onclick=()=>{S.over=true;show('welcome')};document.addEventListener('touchmove',e=>{if($('#game').classList.contains('on'))e.preventDefault()},{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});document.addEventListener('touchend',e=>{let n=Date.now();if(n-lastTap<350)e.preventDefault();lastTap=n},{passive:false});document.addEventListener('contextmenu',e=>e.preventDefault())})();</script></body></html>
